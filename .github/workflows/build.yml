name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: |
          mkdir -p temp_extracted
          unzip -q source.zip -d temp_extracted
          # Находим, где лежит gradlew внутри архива, и переносим файлы оттуда в корень
          PROJECT_DIR=$(find temp_extracted -name "gradlew" -exec dirname {} \;)
          if [ -n "$PROJECT_DIR" ]; then
            echo "Found project at: $PROJECT_DIR"
            cp -r "$PROJECT_DIR"/* ./
          else
            cp -r temp_extracted/* ./
          fi
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
