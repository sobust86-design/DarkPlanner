name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: |
          mkdir -p extracted_project
          unzip -q source.zip -d extracted_project
          # Находим, где лежит build.gradle или папка app внутри распаковки
          cd extracted_project
          SUBDIR=$(find . -maxdepth 2 -name "app" -type d | head -n 1 | xargs dirname)
          if [ "$SUBDIR" != "." ] && [ -n "$SUBDIR" ]; then
            cd "$SUBDIR"
          fi
          cp -r . ../../
          cd ../../
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
